<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3X-UI Autopilot: подключение</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">

<meta name="description" content="Вставьте ссылку-подписку, выберите устройство: покажу, какое приложение поставить и как подключиться. Всё считается в браузере.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%230b7285'/%3E%3Cpath d='M32 14 17 23v11c0 10 7 15 15 18 8-3 15-8 15-18V23z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='m25 34 5 5 9-10' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: Ultraviolet, recoloured to the launch-video palette (ink pills, teal accent) (deal 1/3, seed single-purpose-tool-where-vpn-5710·9a57eaa9·2026-10-27·r0) · redesign: full
 * nav: a top bar, wordmark and language switch · signature: the subscription link as one pill field that the whole page reads from · states: empty, invalid, accepted · ultraviolet: cool white and night by system theme, teal in place of violet, system faces (the page loads nothing from outside)
 * axes: light/geometric-sans/cool · posture: committed · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V3 · weakest: V, a tool page has one honest shape; set the three steps on a numbered rail instead of stacked cards */
/* Hallmark · answered F4 · the lang, platform and package-manager toggles are selected states of one control, not primary buttons; the primary is .btn */
:root {
  color-scheme: light dark;
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --color-error: oklch(52% 0.19 27); --color-success: oklch(52% 0.11 165);
  --container: 760px; --gutter: 24px;
  --color-paper: oklch(97% 0.006 230); --color-paper-2: oklch(99% 0.003 230); --color-paper-3: oklch(94% 0.01 230);
  --color-ink: oklch(20% 0.02 230); --color-ink-2: oklch(32% 0.025 230); --color-muted: oklch(50% 0.025 235);
  --color-rule: oklch(90% 0.012 230); --color-rule-2: oklch(80% 0.02 230);
  --color-accent: oklch(52% 0.09 205); --color-accent-deep: oklch(44% 0.085 205); --color-accent-soft: oklch(90% 0.04 200);
  --color-accent-ink: oklch(98% 0.005 230); --color-focus: oklch(52% 0.09 205);
  --font-display: "Avenir Next", "Segoe UI", ui-rounded, ui-sans-serif, system-ui, sans-serif;
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-outlier: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-card: 16px; --radius-pill: 999px; --rule-hair: 1px;
  --tracking-display: -0.03em; --display-weight: 500;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-error: oklch(72% 0.17 27); --color-success: oklch(80% 0.12 165);
    --color-paper: oklch(17% 0.02 230); --color-paper-2: oklch(21% 0.02 230); --color-paper-3: oklch(25% 0.022 230);
    --color-ink: oklch(94% 0.01 230); --color-ink-2: oklch(84% 0.015 230); --color-muted: oklch(70% 0.025 230);
    --color-rule: oklch(29% 0.02 230); --color-rule-2: oklch(42% 0.03 230);
    --color-accent: oklch(78% 0.12 205); --color-accent-deep: oklch(70% 0.11 205); --color-accent-soft: oklch(34% 0.06 205);
    --color-accent-ink: oklch(18% 0.02 230); --color-focus: oklch(78% 0.12 205);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.55; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 25%, transparent); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
p { margin: 0; text-wrap: pretty; }
svg { display: block; }
[hidden] { display: none !important; }
button, input { font: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.1; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
h1, h2, h4 { text-transform: lowercase; }

/* the one container recipe */
.bar, main, footer { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); min-height: 64px; border-bottom: var(--rule-hair) solid var(--color-rule); }
.brand { font: var(--display-weight) var(--text-lg)/1 var(--font-display); letter-spacing: var(--tracking-display); }
.brand span { color: var(--color-accent); }
.lang { display: flex; gap: var(--space-2xs); }
.lang button { min-width: 44px; min-height: 44px; padding: 0 var(--space-sm); border: 0; border-radius: var(--radius-pill); background: none; color: var(--color-muted); font: var(--display-weight) var(--text-sm)/1 var(--font-display); text-transform: lowercase; cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--color-rule-2); transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.lang button:hover { color: var(--color-ink); }
.lang button:active { transform: scale(0.97); }
.lang button[aria-pressed=true] { background: var(--color-ink); color: var(--color-paper); box-shadow: none; }

main { padding-block: var(--space-xl) var(--space-2xl); }
h1 { max-width: 20ch; font-size: var(--text-3xl); }
.lead { max-width: 52ch; margin-top: var(--space-sm); color: var(--color-ink-2); }
.privacy { display: inline-flex; align-items: center; gap: var(--space-xs); margin-top: var(--space-lg); padding: var(--space-xs) var(--space-md); border-radius: var(--radius-pill); background: var(--color-paper-2); color: var(--color-muted); font-size: var(--text-sm); }
.privacy svg { flex: none; }

/* three steps on one rail */
section { margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: var(--rule-hair) solid var(--color-rule); }
h2 { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-xl); }
.num { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: var(--radius-pill); box-shadow: inset 0 0 0 1.5px var(--color-ink); font: var(--display-weight) var(--text-sm)/1 var(--font-display); font-variant-numeric: tabular-nums; }
section > :not(h2) { margin-left: calc(32px + var(--space-sm)); }

input[type=text] { width: calc(100% - 32px - var(--space-sm)); min-height: 48px; margin-top: var(--space-md); padding: 0 var(--space-lg); border: 0; border-radius: var(--radius-pill); background: var(--color-paper-2); color: var(--color-ink); font-size: var(--text-md); box-shadow: inset 0 0 0 1.5px var(--color-rule-2); }
input[type=text]::placeholder { color: var(--color-muted); }
input[type=text]:hover { box-shadow: inset 0 0 0 1.5px var(--color-ink-2); }
input[type=text]:focus-visible { box-shadow: inset 0 0 0 1.5px var(--color-ink); }
.msg { min-height: 1.5em; margin-top: var(--space-xs); padding-left: var(--space-lg); font-size: var(--text-sm); }
.msg.bad { color: var(--color-error); }
.msg.ok { color: var(--color-success); }
.hint { color: var(--color-muted); font-size: var(--text-sm); }
section > .hint { margin-top: var(--space-xs); padding-left: var(--space-lg); }

.tabs { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-md); }
.tabs button { min-height: 44px; padding: 0 var(--space-md); border: 0; border-radius: var(--radius-pill); background: none; color: var(--color-ink); font: var(--display-weight) var(--text-sm)/1 var(--font-display); cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--color-rule-2); transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.tabs button:hover { box-shadow: inset 0 0 0 1.5px var(--color-ink); }
.tabs button:active { transform: scale(0.97); }
.tabs button[aria-pressed=true] { background: var(--color-ink); color: var(--color-paper); box-shadow: none; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); }
.pmbox { margin-top: var(--space-md); }
.pmbox .tabs { margin-top: 0; }
.pmbox .hint { flex-basis: 100%; }
#clashBox .hint { margin-top: var(--space-md); }
#clashBox input[type=text] { margin-top: var(--space-xs); width: 100%; }
#clashBox .msg { padding-left: var(--space-lg); }
section#s2 > #clashBox { margin-left: calc(32px + var(--space-sm)); }

/* apps are rows under hairlines, not cards */
.apps { display: grid; margin-top: var(--space-md); }
.app { padding-block: var(--space-lg); border-top: var(--rule-hair) solid var(--color-rule); }
.app:first-child { border-top: 0; }
.app h3 { font-size: var(--text-lg); }
.app p { margin-top: var(--space-2xs); color: var(--color-muted); font-size: var(--text-sm); }
.app p:empty { display: none; }
.app .row { margin-top: var(--space-sm); }
.app h4 { margin-top: var(--space-lg); font-size: var(--text-md); }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 var(--space-lg); border: 0; border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-paper); font: var(--display-weight) var(--text-sm)/1 var(--font-display); text-transform: lowercase; text-decoration: none; cursor: pointer; transition: background-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-ink-2); }
.btn:active { transform: scale(0.98); }
.btn.ghost { background: none; color: var(--color-ink); box-shadow: inset 0 0 0 1.5px var(--color-ink); }
.btn.ghost:hover { background: var(--color-paper-2); }
.btn[aria-disabled=true] { opacity: 0.45; pointer-events: none; }

ol { margin: var(--space-md) 0 0; padding-left: var(--space-lg); }
li { margin: var(--space-xs) 0; padding-left: var(--space-2xs); }
li::marker { color: var(--color-muted); font-variant-numeric: tabular-nums; }
pre { margin: var(--space-sm) 0 0; padding: var(--space-md) var(--space-lg); border-radius: var(--radius-card); background: var(--color-paper-2); color: var(--color-ink); font: var(--text-sm)/1.6 var(--font-outlier); white-space: pre; overflow-x: auto; }
footer { padding-block: var(--space-lg) var(--space-2xl); border-top: var(--rule-hair) solid var(--color-rule); color: var(--color-muted); font-size: var(--text-sm); }

@media (max-width: 40rem) {
  :root { --gutter: 16px; }
  h1 { font-size: var(--text-2xl); }
  section > :not(h2), section#s2 > #clashBox { margin-left: 0; }
  input[type=text] { width: 100%; }
  .msg, section > .hint { padding-left: var(--space-md); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand">3X-UI <span>Autopilot</span></div>
  <div class="lang" role="group" aria-label="Language"><button id="l-ru" aria-pressed="true">RU</button> <button id="l-en" aria-pressed="false">EN</button></div>
</div>
<main>
  <h1 id="t-title"></h1>
  <p class="lead" id="t-lead"></p>
  <p class="privacy"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span id="t-privacy"></span></p>

  <section>
    <h2><span class="num">1</span><span id="t-step1"></span></h2>
    <input type="text" id="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://203.0.113.10/…/…">
    <p class="msg" id="msg" role="status"></p>
    <p class="hint" id="t-where"></p>
  </section>

  <section id="s2" hidden>
    <h2><span class="num">2</span><span id="t-step2"></span></h2>
    <div class="tabs" id="platforms" role="group"></div>
    <div id="pmBox" class="row pmbox" hidden>
      <span class="hint" id="t-pm"></span>
      <div class="tabs" id="pms" role="group"></div>
      <p class="hint" id="t-pmhint"></p>
    </div>
    <div id="clashBox" hidden>
      <p class="hint" id="t-clash"></p>
      <input type="text" id="clash" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://203.0.113.10/…/…">
      <p class="msg" id="clashMsg" role="status"></p>
    </div>
    <div class="apps" id="apps"></div>
  </section>

  <section id="s3" hidden>
    <h2><span class="num">3</span><span id="t-step3"></span></h2>
    <ol id="steps"></ol>
    <p class="hint" id="t-fail"></p>
  </section>
</main>
<footer id="t-foot"></footer>

<script id="logic">
"use strict";
/* Логика без обращения к DOM: её же проверяют тесты (tools/test/connect.test.js). */
var APPS = {
  happ:     { name: "Happ",            site: "https://www.happ.su/",                               deep: function (u) { return "happ://add/" + u; } },
  hiddify:  { name: "Hiddify",         site: "https://hiddify.com/",                               deep: function (u, n) { return "hiddify://import/" + u + "#" + encodeURIComponent(n); } },
  karing:   { name: "Karing",          site: "https://karing.app/",                                deep: function (u, n) { return "karing://install-config?url=" + encodeURIComponent(u) + "&name=" + encodeURIComponent(n); } },
  streisand:{ name: "Streisand",       site: "https://apps.apple.com/app/streisand/id6450534064",  deep: function (u) { return "streisand://import/" + u; } },
  v2rayng:  { name: "v2rayNG",         site: "https://github.com/2dust/v2rayNG/releases",          deep: null },
  v2rayn:   { name: "v2rayN",          site: "https://github.com/2dust/v2rayN/releases",           deep: null },
  clash:    { name: "Clash Verge Rev", site: "https://github.com/clash-verge-rev/clash-verge-rev/releases", deep: function (u, n) { return "clash://install-config?url=" + encodeURIComponent(u) + "&name=" + encodeURIComponent(n); } },
  singbox:  { name: "sing-box",        site: "https://sing-box.sagernet.org/",                     deep: function (u, n) { return "sing-box://import-remote-profile?url=" + encodeURIComponent(u) + "#" + encodeURIComponent(n); } },
  /* Роутеры на OpenWrt: ссылку вставляют в само приложение. needs – какая именно ссылка подписки нужна. */
  nikki:    { name: "Nikki",           site: "https://github.com/nikkinikki-org/OpenWrt-nikki",    deep: null, router: true, needs: "clash" },
  openclash:{ name: "OpenClash",       site: "https://github.com/vernesong/OpenClash",             deep: null, router: true, needs: "clash" },
  passwall2:{ name: "PassWall 2",      site: "https://github.com/Openwrt-Passwall/openwrt-passwall2", deep: null, router: true, needs: "auto" }
};
var PLATFORMS = {
  ios:     ["happ", "streisand", "hiddify", "karing"],
  android: ["happ", "hiddify", "v2rayng", "karing", "singbox"],
  windows: ["happ", "hiddify", "v2rayn", "clash", "karing"],
  macos:   ["happ", "hiddify", "clash", "karing", "streisand"],
  linux:   ["hiddify", "clash", "singbox"],
  router:  ["nikki", "passwall2", "openclash"]
};

/* Быстрая установка на OpenWrt. Команды сверены с README проектов; docs – где смотреть актуальную версию.
   opkg – OpenWrt до 24.10, apk – OpenWrt 25.12 и новее. */
var ROUTER_INSTALL = {
  nikki: {
    docs: "https://github.com/nikkinikki-org/OpenWrt-nikki",
    requires: { ru: "OpenWrt 24.10 или новее, firewall4.", en: "OpenWrt 24.10 or newer, firewall4." },
    opkg: ["wget -O - https://github.com/nikkinikki-org/OpenWrt-nikki/raw/refs/heads/main/feed.sh | ash", "opkg update", "opkg install nikki luci-app-nikki"],
    apk:  ["wget -O - https://github.com/nikkinikki-org/OpenWrt-nikki/raw/refs/heads/main/feed.sh | ash", "apk update", "apk add nikki luci-app-nikki"]
  },
  passwall2: {
    docs: "https://github.com/Openwrt-Passwall/openwrt-passwall2",
    requires: { ru: "Скачайте последнюю версию luci-app-passwall2 со страницы релизов (ссылка «Документация») в /tmp. Если не хватает xray-core, добавьте репозиторий PassWall по README.",
                en: "Download the latest luci-app-passwall2 from the releases page (the “Docs” link) into /tmp. If xray-core is missing, add the PassWall repository as described in the README." },
    opkg: ["cd /tmp", "opkg update", "opkg install luci-app-passwall2_*.ipk", "/etc/init.d/rpcd restart"],
    apk:  ["cd /tmp", "apk update", "apk add --allow-untrusted luci-app-passwall2_*.apk", "/etc/init.d/rpcd restart"]
  },
  openclash: {
    docs: "https://github.com/vernesong/OpenClash",
    requires: { ru: "Скачайте последнюю версию luci-app-openclash со страницы релизов (ссылка «Документация») в /tmp. Нужен интернет на роутере: ядро скачивается при первом запуске.",
                en: "Download the latest luci-app-openclash from the releases page (the “Docs” link) into /tmp. The router needs internet: the core is downloaded on first start." },
    opkg: ["opkg update", "opkg remove dnsmasq && opkg install dnsmasq-full", "opkg install bash curl ca-bundle ip-full ruby ruby-yaml kmod-tun kmod-inet-diag kmod-nft-tproxy unzip luci-compat luci luci-base", "cd /tmp", "opkg install luci-app-openclash*.ipk"],
    apk:  ["apk update", "apk del dnsmasq && apk add dnsmasq-full", "apk add bash curl ca-bundle ip-full ruby ruby-yaml kmod-tun kmod-inet-diag kmod-nft-tproxy unzip luci-compat luci luci-base", "cd /tmp", "apk add --allow-untrusted luci-app-openclash*.apk"]
  }
};

/* Принимает только https-ссылку подписки: схема, имя хоста и непустой путь. Возвращает {ok, url, host} или {ok:false, reason}. */
function parseSubscription(input) {
  var text = String(input || "").trim();
  if (!text) return { ok: false, reason: "empty" };
  if (/\s/.test(text)) return { ok: false, reason: "spaces" };
  var u;
  try { u = new URL(text); } catch (e) { return { ok: false, reason: "invalid" }; }
  if (u.protocol !== "https:") return { ok: false, reason: "scheme" };
  if (!u.hostname || u.username || u.password) return { ok: false, reason: "invalid" };
  if (u.pathname.replace(/\//g, "") === "") return { ok: false, reason: "path" };
  return { ok: true, url: u.href, host: u.hostname };
}

/* Кнопки приложений платформы: открыть в приложении (если есть схема), страница загрузки, ссылка для копирования. */
function appCards(platform, url, profileName, clashUrl) {
  var keys = PLATFORMS[platform] || [];
  return keys.map(function (key) {
    var app = APPS[key];
    var card = { key: key, name: app.name, site: app.site, deep: app.deep ? app.deep(url, profileName || "Autopilot") : null, copy: url };
    if (app.router) {
      card.router = true;
      card.needs = app.needs;
      card.copy = app.needs === "clash" ? (clashUrl || null) : url;  /* null: Clash-ссылку ещё не ввели */
    }
    return card;
  });
}

/* Платформа по User-Agent (чтобы сразу открыть нужную вкладку). */
function detectPlatform(ua) {
  ua = String(ua || "");
  if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
  if (/Android/i.test(ua)) return "android";
  if (/Windows/i.test(ua)) return "windows";
  if (/Macintosh|Mac OS X/i.test(ua)) return "macos";
  if (/Linux|X11/i.test(ua)) return "linux";
  return "windows";
}

var TEXT = {
  ru: {
    title: "Подключение к вашему VPN", lead: "Вставьте ссылку-подписку, выберите устройство: покажу, какое приложение поставить и как добавить сервер.",
    privacy: "Страница работает только в вашем браузере: ссылка никуда не отправляется.",

<script id="ui">
"use strict";
(function () {
  if (typeof document === "undefined") return;
  var $ = function (id) { return document.getElementById(id); };
  var lang = /^ru/i.test(navigator.language || "ru") ? "ru" : "en";
  var platform = detectPlatform(navigator.userAgent);
  var current = null, clash = null, pm = "opkg";

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  function renderStatic() {
    var t = TEXT[lang];
    document.documentElement.lang = lang;
    $("t-title").textContent = t.title; $("t-lead").textContent = t.lead; $("t-privacy").textContent = t.privacy;
    $("t-step1").textContent = t.step1; $("t-where").textContent = t.where;
    $("t-step2").textContent = t.step2; $("t-step3").textContent = t.step3; $("t-fail").textContent = t.fail; $("t-foot").textContent = t.foot;
    $("l-ru").setAttribute("aria-pressed", String(lang === "ru")); $("l-en").setAttribute("aria-pressed", String(lang === "en"));
    var steps = $("steps"); steps.textContent = "";
    t.steps.forEach(function (s) { steps.appendChild(el("li", null, s)); });
  }

  function renderApps() {
    var t = TEXT[lang], tabs = $("platforms"), apps = $("apps");
    tabs.textContent = ""; apps.textContent = "";
    Object.keys(PLATFORMS).forEach(function (key) {
      var b = el("button", null, t.platforms[key]);
      b.type = "button"; b.setAttribute("aria-pressed", String(key === platform));
      b.addEventListener("click", function () { platform = key; renderApps(); });
      tabs.appendChild(b);
    });
    if (!current) return;
    $("clashBox").hidden = platform !== "router";
    $("pmBox").hidden = platform !== "router";
    $("t-clash").textContent = t.clashLabel + ". " + t.clashHint;
    $("t-pm").textContent = t.pm; $("t-pmhint").textContent = t.pmHint;
    var pms = $("pms"); pms.textContent = "";
    ["opkg", "apk"].forEach(function (name) {
      var b = el("button", null, name); b.type = "button"; b.setAttribute("aria-pressed", String(name === pm));
      b.addEventListener("click", function () { pm = name; renderApps(); });
      pms.appendChild(b);
    });
    $("s3").hidden = !current || platform === "router";
    appCards(platform, current.url, "Autopilot", clash ? clash.url : null).forEach(function (card) {
      var box = el("div", "app"); box.appendChild(el("h3", null, card.name));
      box.appendChild(el("p", null, card.router ? (card.copy ? t.need2[card.needs] : t.need[card.needs]) : (card.deep ? "" : t.manual)));
      if (card.router) {
        var info = ROUTER_INSTALL[card.key], cmds = info[pm].join("\n");
        box.appendChild(el("p", "hint", t.auto));
        box.appendChild(el("pre", null, "autopilot router " + card.key));
        box.appendChild(el("h4", null, t.install));
        box.appendChild(el("p", "hint", t.installIntro));
        var pre = el("pre", null, cmds); box.appendChild(pre);
        box.appendChild(el("p", "hint", info.requires[lang]));
        var cmdRow = el("div", "row");
        var cc = el("button", "btn ghost", t.copyAll); cc.type = "button";
        cc.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cmds).then(function () { cc.textContent = t.copied; setTimeout(function () { cc.textContent = t.copyAll; }, 1500); }, function () {});
        });
        var dd = el("a", "btn ghost", t.docs); dd.href = info.docs; dd.target = "_blank"; dd.rel = "noopener noreferrer";
        cmdRow.appendChild(cc); cmdRow.appendChild(dd); box.appendChild(cmdRow);
        box.appendChild(el("h4", null, t.step3));
        var list = el("ol"); t.routerSteps[card.key].forEach(function (s) { list.appendChild(el("li", null, s)); });
        box.appendChild(list); box.appendChild(el("p", "hint", t.routerNote));
      }
      var row = el("div", "row");
      if (card.deep) { var open = el("a", "btn", t.open); open.href = card.deep; row.appendChild(open); }
      if (card.router && !card.copy) { box.appendChild(row); apps.appendChild(box); return; }
      var dl = el("a", "btn ghost", t.download); dl.href = card.site; dl.target = "_blank"; dl.rel = "noopener noreferrer"; row.appendChild(dl);
      var cp = el("button", "btn ghost", t.copy); cp.type = "button";
      cp.addEventListener("click", function () {
        var done = function () { cp.textContent = t.copied; setTimeout(function () { cp.textContent = t.copy; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(card.copy).then(done, function () {});
      });
      row.appendChild(cp); box.appendChild(row); apps.appendChild(box);
    });
  }

  function onInput() {
    var t = TEXT[lang], msg = $("msg"), res = parseSubscription($("url").value);
    current = res.ok ? res : null;
    $("s2").hidden = !current;
    if (!$("url").value.trim()) { msg.textContent = ""; msg.className = "msg"; }
    else if (res.ok) { msg.textContent = t.ok + res.host; msg.className = "msg ok"; }
    else { msg.textContent = t.err[res.reason]; msg.className = "msg bad"; }
    renderApps();
  }

  function onClash() {
    var t = TEXT[lang], msg = $("clashMsg"), res = parseSubscription($("clash").value);
    clash = res.ok ? res : null;
    if (!$("clash").value.trim()) { msg.textContent = ""; msg.className = "msg"; }
    else if (res.ok) { msg.textContent = t.ok + res.host; msg.className = "msg ok"; }
    else { msg.textContent = t.err[res.reason]; msg.className = "msg bad"; }
    renderApps();
  }

  $("url").addEventListener("input", onInput);
  $("clash").addEventListener("input", onClash);
  $("l-ru").addEventListener("click", function () { lang = "ru"; renderStatic(); onInput(); });
  $("l-en").addEventListener("click", function () { lang = "en"; renderStatic(); onInput(); });
  renderStatic(); renderApps();
})();
</script>
</body>
